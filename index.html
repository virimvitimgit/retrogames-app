<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>VideoJogos 🎮</h1>
        <p>Apenas os Melhores!</p>
    </header>
    <main class = "container">
        <div class = "titulo-secao">
            <div>
                <h2>Nosso Catalogo</h2>
                <p>Conheça os Jogos Disponíveis</p>
            </div>
            <button id  = "btnCadastrar" type = "button">+ Cadastrar Jogo</button>
        </div>
        <section id = "listarGames" class = "listar-games">
            <p id = "mensagemVazia">Nenhum Jogo cadastrado</p>
        </section>
    </main>
    <dialog id = "modalCadastro">
        <h2>Novo Jogo</h2>
        <form id = "formgame">
            <label for = "game">Nome do Jogo</label>
            <input type = "text" id = "game" required>
            <label for = "desenvolvedor">Desenvolvedor</label>
            <input type = "text" id = "desenvolvedor" required>
            <label for = "genero">Gênero do Jogo</label>
            <input type = "text" id = "genero" required>
            <label for = "imagem">URL da Imagem do Jogo</label>
            <input type = "url" id = "imagem" placeholder="https://site.com/capa.jpg" required>
            <label for = "preco">Preço (R$)</label>
            <input type = "number" id = "preco" min = "0.01" step = "0.01" required>
            <div class = "acoes">
                <button type = "button" id = "btnCancelar" class = "cancelar">Cancelar</button>
                <button type = "submit">Salvar Jogo</button>

            </div>
        </form>
    </dialog>
    <script src = "script.js"></script>
</body>
</html>
